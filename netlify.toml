"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "public"
  functions = "netlify/functions"
  environment = { NODE_VERSION = "22" }

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
